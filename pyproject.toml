[project]
name = "7dtd-loadgen"
version = "0.6.0"
description = "Controlled LiteNetLib load generation for 7 Days to Die dedicated servers"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16", "mypy>=1.15"]

[tool.ruff]
# Same 100-column cap as .editorconfig. line-length alone does not enforce
# it: the cap is E501, which the default rule set leaves out, so the select
# below has to name E or the cap is decoration.
line-length = 100

[tool.ruff.lint]
# Ruff's default set (E4, E7, E9, F) finds almost nothing here. This is the
# full set the tree passes today, so a defect in any of these categories fails
# `make lint` and with it the CI job. Categories with open findings
# (ANN, D, S, PTH, COM, PLR2..4, T20, FBT, PLC0415) stay off rather than
# being silenced: enabling one is a separate change, made with its fixes.
select = [
    "E",    # pycodestyle, including the 100-column cap (E501)
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort: import order and grouping
    "UP",   # pyupgrade: syntax the pinned Python 3.11 makes obsolete
    "B",    # flake8-bugbear: mutable defaults, shadowed loop vars, ...
    "PGH",  # pygrep-hooks: bare eval/exec, blanket noqa or type: ignore
    "PLE",  # pylint errors: unreachable code, bad except, misused loop vars
    "RET",  # flake8-return: redundant else/return paths
    "PIE",  # flake8-pie: misimplemented, non-idiomatic constructs
    "Q",    # flake8-quotes: one string style across the tree
    "RUF",  # ruff-specific correctness rules
    "ASYNC",  # async mistakes (no async code yet, so it stays free)
    "TID",  # tidy-imports: banned APIs
    "ERA",  # eradicate: commented-out code
    "LOG",  # flake8-logging: f-strings only, no % or .format in log calls
    "G",    # flake8-logging-format: the .format and % variants G00x cover
    "A",    # flake8-builtins: shadowing a stdlib name
    "BLE",  # flake8-blind-except: bare except Exception
    "EXE",  # flake8-executable: shebang and exec permissions
    "ARG",  # flake8-unused-arguments
    "FA",   # flake8-future-annotations: __future__ imports stay consistent
    "FURB", # refurb: the rewrite ruff already knows, minus the preview rules
    "DTZ",  # flake8-datetimez: a naive datetime is a bug waiting on a host TZ
    "ISC",  # flake8-implicit-str-concat: silent line joins
    "ICN",  # flake8-import-conventions: aliased stdlib imports stay conventional
]

[tool.mypy]
python_version = "3.11"
files = ["scripts", "tools", "tests"]
# tools/ and scripts/ are entry-point directories, not packages, and two of
# them define same-named helpers; without this mypy stops at the first
# duplicate module name instead of checking the tree.
explicit_package_bases = true
mypy_path = "tools:scripts:tests"
warn_unused_ignores = true
# The ratchet below names 22 modules by name. A rename or a delete would
# leave the entry matching nothing, and the module it used to hold would
# silently drop back to untyped with no error anywhere: an overrides block
# that matches no module is not an error by default. This makes it one.
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
# Free strictness, proven by a clean run on the tree as it stands. Equality
# that mypy could not disprove used to pass silently; a partially annotated
# function used to be unchecked; a test decorator on an untyped fixture used
# to leave the test itself untyped.
strict_equality = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
# Dead code, not a style opinion: it fires where a signature claims more than
# the parser can return. Two fuzz helpers had that (a snapshot annotated as
# dict while telnet_snapshot yields dict | None, and a run-meta annotated as a
# dict while the mutator hands back a hostile scalar); both are annotated now.
warn_unreachable = true
# Still off, with findings open: check_untyped_defs and disallow_any_generics
# (the var-annotated and type-arg errors they raise), disallow_untyped_defs
# (the ratchet below), no_implicit_reexport (the `import bloodmoon_profile as
# B` alias tests monkeypatch through), and strict = true.

[tool.pytest.ini_options]
testpaths = ["tests"]

# Typing ratchet. The tree is not fully annotated, so disallow_untyped_defs
# cannot be a global flag yet. These entry points are annotated today and are
# held to the strict rule, so a new unannotated function in one of them fails
# `make lint` instead of quietly widening the untyped surface. Every remaining
# module moves onto this list as it gets annotated, and the list empties.
[[tool.mypy.overrides]]
module = [
    "bench_report",
    "capacity_sweep",
    "conftest",
    "consolidated_report",
    "coverage_badge",
    "json_shape",
    "loadgen_cli",
    "loadgen_config",
    "loadgen_manifest",
    "procs",
    "sbom",
    "scenario_env",
    "stats_pass_fail",
    "sut_catalog",
    "sut_telnet",
    "test_bench_report_fuzz",
    "test_line_endings",
    "test_sut_capture_fuzz",
    "test_text_encoding",
    "test_webdash_password_hash",
    "validate_reconnect",
    "webdash_password_hash",
]
disallow_untyped_defs = true
check_untyped_defs = true
