name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run: the badge publish writes to the badges branch, so a runner
  # lost mid-push cannot be retried from the UI without landing an empty
  # commit just to trigger a new push.
  workflow_dispatch:

# One run per ref: a fresh push cancels the superseded in-progress run
# instead of queueing duplicate parallel jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  loadgen:
    runs-on: ubuntu-latest
    # A hung self-test must fail the job, not burn the 360-minute default.
    timeout-minutes: 30
    steps:
      # Pinned to commit SHAs (mutable tags) for reproducible, tamper-proof CI.
      # persist-credentials off: the job is read-only, and a token left in
      # .git/config would stay readable to every later build/test step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - run: make test

  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: loadgen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Own group, overriding the workflow-level cancel-in-progress above. That
    # setting is right for the test lane (a superseded push should stop
    # spending runner minutes) and wrong here: this job mutates the badges
    # branch, and cancelling it mid-push leaves a half-applied ref that the
    # next run cannot fast-forward past. cancel-in-progress: false queues
    # instead, so two close main pushes publish in order rather than racing
    # two writers onto one ref.
    concurrency:
      group: ci-coverage-badge-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # The badge push authenticates itself with the extraheader below, so the
      # token does not have to be left behind in .git/config for the test lane.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - run: make coverage
      - run: uv run --locked python scripts/coverage_badge.py TestResults/coverage.cobertura.xml "$RUNNER_TEMP/coverage.svg"
      - name: Publish the badge to the badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The token rides an http header, never a remote URL: a credential in
          # a URL lands in every error message, process listing and log line
          # that echoes the remote.
          auth="http.https://github.com/.extraheader=AUTHORIZATION: bearer ${GITHUB_TOKEN}"
          if git -c "$auth" ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git -c "$auth" clone --depth 1 --branch badges origin badge-repo
          else
            git init -q -b badges badge-repo
            git -C badge-repo remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          cp "$RUNNER_TEMP/coverage.svg" badge-repo/
          cd badge-repo
          git config user.name "hordeforge-ci"
          git config user.email "ci@hordeforge.noreply.github.com"
          git add coverage.svg
          git diff --cached --quiet || git commit -m "update coverage badge"
          git -c "$auth" push origin badges
