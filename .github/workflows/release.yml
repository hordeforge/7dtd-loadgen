name: release

# Tag-driven releases (hordeforge/.github REPOSITORY_STANDARDS.md, §8): a
# vX.Y.Z tag must agree with the version this repository actually ships, so a
# mistyped or forgotten bump is rejected instead of becoming a release nobody
# can reproduce.
#
# The self-contained binary is deliberately NOT built here: publishing one
# would claim a platform matrix this workflow does not exercise. Gating the
# tag is the half that can be proven automatically.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions pinned by full commit SHA (tag in comment) so a moved tag or a
      # compromised major-version release cannot inject code into the pipeline.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches src/LoadGen/LoadGen.csproj
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          MANIFEST="src/LoadGen/LoadGen.csproj"
          case "$TAG" in v*) ;; *) echo "ERROR: tag '$TAG' does not start with 'v'" >&2; exit 1;; esac
          SHIPPED="$(sed -n 's|.*<Version>\([^<]*\)</Version>.*|\1|p' "$MANIFEST" | head -1)"
          if [ -z "$SHIPPED" ]; then
            echo "ERROR: no <Version>...</Version> found in $MANIFEST" >&2
            exit 1
          fi
          if [ "$SHIPPED" != "${TAG#v}" ]; then
            echo "ERROR: tag $TAG but $MANIFEST ships $SHIPPED; make them match before tagging" >&2
            exit 1
          fi
          echo "ok: tag $TAG matches $MANIFEST ($SHIPPED)"
